<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Transfer - Şoför Görev Ekranı</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .task-card { background-color: #1e1e1e; border-radius: 16px; border: 1px solid #2d2d2d; }
        .btn-action { padding: 16px; font-size: 1.1rem; border-radius: 12px; font-weight: 600; }
    </style>
</head>
<body class="p-3">

<div class="container py-3" style="max-width: 480px;">
    <!-- Üst Başlık -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="m-0 fw-bold text-warning"><i class="fa-solid fa-shuttle-van me-2"></i>VIP Görev Paneli</h4>
        <span class="badge bg-success" id="task-status-badge">Aktif İş</span>
    </div>

    <!-- Görev Kartı -->
    <div class="task-card p-4 mb-4 shadow">
        <div class="text-muted small text-uppercase fw-bold mb-1">Rezervasyon Kodu</div>
        <h3 class="fw-bold text-white mb-3" id="booking-id">-</h3>

        <hr class="border-secondary mb-3">

        <div class="mb-3">
            <div class="text-muted small"><i class="fa-solid fa-user me-2 text-primary"></i>Müşteri Adı</div>
            <div class="fs-5 fw-semibold" id="customer-name">-</div>
        </div>

        <div class="mb-3">
            <div class="text-muted small"><i class="fa-solid fa-phone me-2 text-primary"></i>İletişim Numarası</div>
            <a href="#" id="customer-phone-link" class="fs-5 fw-semibold text-warning text-decoration-none">-</a>
        </div>

        <div class="mb-3">
            <div class="text-muted small"><i class="fa-solid fa-users me-2 text-primary"></i>Yolcu Sayısı</div>
            <div class="fs-5 fw-semibold" id="passengers">-</div>
        </div>

        <div class="mb-1">
            <div class="text-muted small"><i class="fa-solid fa-location-dot me-2 text-danger"></i>Alış Noktası</div>
            <div class="fs-6 fw-semibold text-light" id="pickup-address">-</div>
        </div>
    </div>

    <!-- Aksiyon Butonları -->
    <div class="d-grid gap-3" id="action-area">
        <a id="nav-btn" href="#" target="_blank" class="btn btn-outline-info btn-action">
            <i class="fa-solid fa-route me-2"></i>Haritada Navigasyon Aç
        </a>
        <button onclick="completeTask()" class="btn btn-success btn-action">
            <i class="fa-solid fa-circle-check me-2"></i>Transferi Tamamladım
        </button>
    </div>
</div>

<script>
    const pathParts = window.location.pathname.split('/');
    const bookingId = pathParts[pathParts.length - 1];

    async function fetchTaskDetails() {
        try {
            const res = await fetch(`/api/v1/driver/task/${bookingId}`);
            const data = await res.json();

            if (data.status === 'SUCCESS') {
                const task = data.task;
                document.getElementById('booking-id').innerText = task.booking_id;
                document.getElementById('customer-name').innerText = task.customer_name;
                document.getElementById('customer-phone-link').innerText = task.phone;
                document.getElementById('customer-phone-link').href = `tel:${task.phone}`;
                document.getElementById('passengers').innerText = `${task.passengers} PAX`;
                document.getElementById('pickup-address').innerText = task.pickup_address;

                document.getElementById('nav-btn').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(task.pickup_address)}`;

                if (task.status === 'COMPLETED') {
                    document.getElementById('task-status-badge').className = "badge bg-secondary";
                    document.getElementById('task-status-badge').innerText = "Tamamlandı";
                    document.getElementById('action-area').innerHTML = '<div class="alert alert-success text-center fw-bold">Bu transfer başarıyla tamamlanmıştır. 👍</div>';
                }
            } else {
                alert('Görev bulunamadı.');
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function completeTask() {
        if (!confirm('Transferi tamamladığınızı onaylıyor musunuz?')) return;

        const res = await fetch('/api/v1/driver/update-task', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ booking_id: bookingId, status: 'COMPLETED' })
        });

        const data = await res.json();
        if (data.status === 'SUCCESS') {
            alert('Tebrikler! Transfer tamamlandı olarak işlendi.');
            fetchTaskDetails();
        }
    }

    fetchTaskDetails();
</script>
</body>
</html>
