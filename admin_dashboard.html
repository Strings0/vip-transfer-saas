<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>VIP Transfer Operasyon Paneli</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f4f6f9; }
        #map { height: 350px; border-radius: 12px; }
        .badge-matched { background-color: #198754; color: #fff; }
        .badge-manual { background-color: #dc3545; color: #fff; }
    </style>
</head>
<body class="p-4">

<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-shuttle-van text-primary me-2"></i>Firma Operasyon Yönetimi</h2>
        <div>
            <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#driverModal"><i class="fa-solid fa-plus me-1"></i>Şoför Ekle</button>
            <button class="btn btn-outline-danger" onclick="logout()">Çıkış Yap</button>
        </div>
    </div>

    <!-- Canlı Harita -->
    <div class="card mb-4 border-0 shadow-sm">
        <div class="card-header bg-white font-weight-bold">📍 Canlı Harita (Şoförler ve Müşteri Konumları)</div>
        <div class="card-body p-2">
            <div id="map"></div>
        </div>
    </div>

    <!-- Rezervasyon Tablosu -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white"><b>Canlı Rezervasyon Akışı</b></div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Ref No</th>
                        <th>Müşteri</th>
                        <th>Adres</th>
                        <th>Atanan Şoför</th>
                        <th>Durum</th>
                        <th>Aksiyon</th>
                    </tr>
                </thead>
                <tbody id="booking-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Şoför Ekleme Modalı -->
<div class="modal fade" id="driverModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>Yeni Şoför & Araç Kaydı</h5></div>
            <div class="modal-body">
                <form id="driverForm">
                    <div class="mb-2"><input type="text" id="driver_name" class="form-control" placeholder="Ad Soyad" required></div>
                    <div class="mb-2"><input type="text" id="driver_phone" class="form-control" placeholder="Telefon" required></div>
                    <div class="mb-2"><input type="text" id="driver_plate" class="form-control" placeholder="Araç Plakası" required></div>
                    <div class="mb-2"><input type="number" id="driver_capacity" class="form-control" placeholder="Kapasite (PAX)" value="4" required></div>
                    <button type="submit" class="btn btn-primary w-100">Şoförü Kaydet</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Manuel Eşleştirme Modalı -->
<div class="modal fade" id="assignModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>Manuel Şoför Atama</h5></div>
            <div class="modal-body">
                <input type="hidden" id="modal_booking_id">
                <p>Seçilen Rezervasyon: <b id="modal_booking_ref"></b></p>
                <div class="mb-3">
                    <label>Atanacak Şoförü Seçin:</label>
                    <select id="driver_select" class="form-select"></select>
                </div>
                <button class="btn btn-warning w-100" onclick="submitManualAssign()">Şoförü Atave Onayla</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([41.0082, 28.9784], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let globalDrivers = [];

    async function loadData() {
        const companyId = localStorage.getItem('company_id') || 'C1';
        const res = await fetch(`/api/v1/dashboard-data?company_id=${companyId}`);
        const data = await res.json();

        globalDrivers = data.drivers || [];

        const tbody = document.getElementById('booking-table-body');
        tbody.innerHTML = '';

        data.bookings.forEach(b => {
            let actionBtn = b.status === 'MANUAL' 
                ? `<button class="btn btn-sm btn-warning" onclick="openAssignModal('${b.id}')"><i class="fa-solid fa-user-check me-1"></i>Şoför Seç & Eşleştir</button>`
                : `<span class="badge bg-light text-dark">Tamamlandı</span>`;

            tbody.innerHTML += `
                <tr class="${b.status==='MANUAL'?'table-danger':''}">
                    <td><b>${b.id}</b></td>
                    <td>${b.customer_name}</td>
                    <td>${b.pickup_address}</td>
                    <td><b>${b.driver_name}</b></td>
                    <td><span class="badge ${b.status==='MATCHED'?'badge-matched':'badge-manual'}">${b.status}</span></td>
                    <td>${actionBtn}</td>
                </tr>
            `;

            if(b.pickup_lat && b.pickup_lon) {
                L.marker([b.pickup_lat, b.pickup_lon]).addTo(map).bindPopup(`Müşteri: ${b.customer_name}`);
            }
        });
    }

    function openAssignModal(bookingId) {
        document.getElementById('modal_booking_id').value = bookingId;
        document.getElementById('modal_booking_ref').innerText = bookingId;

        const select = document.getElementById('driver_select');
        select.innerHTML = '';
        globalDrivers.forEach(d => {
            select.innerHTML += `<option value="${d.id}">${d.name} (${d.plate})</option>`;
        });

        const modal = new bootstrap.Modal(document.getElementById('assignModal'));
        modal.show();
    }

    async function submitManualAssign() {
        const bookingId = document.getElementById('modal_booking_id').value;
        const driverId = document.getElementById('driver_select').value;

        await fetch('/api/v1/booking/manual-assign', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ booking_id: bookingId, driver_id: driverId })
        });

        alert('Manuel Eşleştirme Başarıyla Yapıldı!');
        location.reload();
    }

    document.getElementById('driverForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const companyId = localStorage.getItem('company_id') || 'C1';
        await fetch('/api/v1/driver/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                company_id: companyId,
                full_name: document.getElementById('driver_name').value,
                phone: document.getElementById('driver_phone').value,
                vehicle_plate: document.getElementById('driver_plate').value,
                capacity: parseInt(document.getElementById('driver_capacity').value)
            })
        });
        alert('Şoför Başarıyla Eklendi!');
        location.reload();
    });

    function logout() { localStorage.clear(); window.location.href = '/'; }
    setInterval(loadData, 4000);
    loadData();
</script>
</body>
</html>
